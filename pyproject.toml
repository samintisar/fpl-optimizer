[project]
name = "fplopt"
version = "0.1.0"
description = "Fantasy Premier League decision optimizer: xP models + MILP planner + Telegram bot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "tenacity",
    "python-dotenv",
    "pandas",
    "pyarrow",
    "duckdb",
    "pandera",
    "rapidfuzz",
]

[project.optional-dependencies]
models = ["lightgbm", "statsmodels", "scikit-learn", "scipy"]
optimize = ["highspy", "pulp"]
bot = ["python-telegram-bot"]
all = ["fplopt[models,optimize,bot]"]

[project.scripts]
fplopt = "fplopt.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-data tests read data/ (build it with `fplopt build all`) and take minutes: deselected
# by default, run with `uv run pytest -m realdata` (a later -m overrides this one).
addopts = ["-m", "not realdata"]
markers = ["realdata: runs on the real data/ tables (skipped if absent); run with -m realdata"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
