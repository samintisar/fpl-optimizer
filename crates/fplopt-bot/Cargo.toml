[package]
name = "fplopt-bot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
fplopt-archive = { version = "0.1.0", path = "../fplopt-archive" }
fplopt-build = { version = "0.1.0", path = "../fplopt-build" }
fplopt-core = { version = "0.1.0", path = "../fplopt-core" }
fplopt-features = { version = "0.1.0", path = "../fplopt-features" }
fplopt-models = { version = "0.1.0", path = "../fplopt-models" }
fplopt-optimize = { version = "0.1.0", path = "../fplopt-optimize" }
fplopt-store = { version = "0.1.0", path = "../fplopt-store" }
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"

[lints]
workspace = true
