[package]
name = "fplopt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "string"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
fplopt-archive = { version = "0.1.0", path = "../fplopt-archive" }
fplopt-build = { version = "0.1.0", path = "../fplopt-build" }
fplopt-core = { version = "0.1.0", path = "../fplopt-core" }
fplopt-parity = { version = "0.1.0", path = "../fplopt-parity" }
gethostname = "1"
log = "0.4.34"
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[lints]
workspace = true

[[bin]]
name = "fplopt-rs"
path = "src/main.rs"
